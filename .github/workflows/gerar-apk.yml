name: Gerar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Compilar o aplicativo
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Renomear APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MeusRemedios.apk

      - name: Guardar APK nos artefatos
        uses: actions/upload-artifact@v4
        with:
          name: MeusRemedios
          path: MeusRemedios.apk

      - name: Publicar link de download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: versao-${{ github.run_number }}
          name: Meus Remédios — versão ${{ github.run_number }}
          body: |
            Para instalar no Android: baixe o arquivo MeusRemedios.apk abaixo, abra e toque em Instalar.
            Se o celular pedir, permita "instalar apps desta fonte".
          files: MeusRemedios.apk
          make_latest: true
