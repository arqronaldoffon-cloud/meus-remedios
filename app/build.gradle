plugins {
    id 'com.android.application'
}

android {
    namespace 'br.com.dasein.meusremedios'
    compileSdk 35

    defaultConfig {
        applicationId 'br.com.dasein.meusremedios'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
