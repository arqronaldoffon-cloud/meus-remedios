plugins {
    id 'com.android.application'
}

android {
    namespace 'br.com.dasein.meusremedios'
    compileSdk 35

    defaultConfig {
        applicationId 'br.com.dasein.meusremedios'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.1'
    }

    signingConfigs {
        fixa {
            storeFile file('meusremedios.keystore')
            storePassword 'meusremedios'
            keyAlias 'meusremedios'
            keyPassword 'meusremedios'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.fixa
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.fixa
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
